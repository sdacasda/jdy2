name: Build Athena AX6600 DAED v19
on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: Parallel jobs
        required: true
        default: "2"
        type: choice
        options: [ "1", "2" ]
      build_profile:
        description: Runtime profile
        required: true
        default: stable
        type: choice
        options: [ stable, performance ]
      release_stage:
        description: Artifact stage
        required: true
        default: test
        type: choice
        options: [ test, candidate ]
permissions:
  contents: read
env:
  KERNEL_SLOT_LIMIT: "6291456"
  KERNEL_MARGIN_WARNING: "131072"
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v5
      - name: Restore executable permissions
        run: |
          chmod +x scripts/*.sh scripts/*.py
          chmod +x tests/runtime/*.sh
          chmod +x packages/athena-runtime/files/usr/bin/athena-*
          chmod +x packages/athena-runtime/files/etc/init.d/athena-runtime
          chmod +x packages/athena-runtime/files/usr/libexec/rpcd/athena
          chmod +x packages/luci-app-athena/root/etc/uci-defaults/95-athena-web
      - name: Validate source project
        id: validate
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/js/test_dashboard_chart.js
          bash scripts/test_runtime_scripts.sh
          python3 scripts/verify_project.py --root .
          python3 scripts/verify_templates.py --templates packages/athena-runtime/files/usr/share/athena/templates --rules packages/athena-runtime/files/usr/share/athena/rules
          python3 scripts/verify_package_layout.py --root .
          python3 scripts/verify_web_config.py --root .
          python3 scripts/security_check.py --root .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget libelf-dev jq curl ccache xsltproc patch perl pahole
          command -v clang
          command -v llc
          command -v llvm-dis
          command -v opt
          command -v llvm-strip
          command -v pahole
          clang --version
          pahole --version
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache/restore@v5
        id: daedcache
        with:
          path: .cache/daed-source
          key: daed-source-${{ runner.os }}-${{ hashFiles('SOURCES.lock.json', 'scripts/assemble_daed_source.sh', 'scripts/install_daed_source.py', 'scripts/verify_daed_source_cache.py', 'scripts/patch_daed_web.py') }}
      - name: Clone immutable LiBwrt source
        run: |
          REPO="$(jq -r '.libwrt.repository' SOURCES.lock.json)"
          COMMIT="$(jq -r '.libwrt.commit' SOURCES.lock.json)"
          git clone --filter=blob:none --no-checkout "$REPO" openwrt
          git -C openwrt fetch --depth=1 origin "$COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$COMMIT"
          bash scripts/stage_local_packages.sh openwrt
      - name: Prepare feeds and locked packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          cd ..
          bash scripts/remove_feed_conflicts.sh openwrt
          bash scripts/prepare_packages.sh openwrt
          cd openwrt
          ./scripts/feeds install -a
          cd ..
          bash scripts/inject_runtime.sh openwrt
          test -f openwrt/package/custom/athena-runtime/Makefile
          test -f openwrt/package/custom/luci-app-athena/Makefile
          rm -rf openwrt/tmp
      - name: Generate effective OpenWrt config
        id: defconfig
        run: |
          make -C openwrt prepare-tmpinfo
          bash scripts/capture_package_registration.sh openwrt package-registration/pre-defconfig
          cp config/athena-v19.config openwrt/.config
          make -C openwrt defconfig
          cp openwrt/.config effective.config
          bash scripts/capture_package_registration.sh openwrt package-registration/post-defconfig
      - name: Verify effective OpenWrt config
        id: configcheck
        run: |
          set -euo pipefail
          bash scripts/verify_config.sh openwrt/.config openwrt/package/custom/daed/Makefile
          mkdir -p daed-provenance
          python3 scripts/verify_daed_provenance.py \
            --packageinfo openwrt/tmp/.packageinfo \
            --lock SOURCES.lock.json \
            --makefile openwrt/package/custom/daed/Makefile \
            | tee daed-provenance/prebuild.txt
      - name: Assemble pinned DAED source
        id: daedsource
        run: |
          set -euo pipefail
          mkdir -p daed-source-provenance
          bash scripts/assemble_daed_source.sh openwrt 2>&1 \
            | tee daed-source-provenance/assembly.log
          make -C openwrt package/daed/download V=s 2>&1 \
            | tee daed-source-provenance/openwrt-download-check.log
      - uses: actions/cache/save@v5
        name: Save verified DAED source cache
        if: steps.daedsource.outcome == 'success' && steps.daedcache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .cache/daed-source
          key: daed-source-${{ runner.os }}-${{ hashFiles('SOURCES.lock.json', 'scripts/assemble_daed_source.sh', 'scripts/install_daed_source.py', 'scripts/verify_daed_source_cache.py', 'scripts/patch_daed_web.py') }}
      - name: Build both images
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail
          make -C openwrt download -j2
          make -C openwrt -j"${{ inputs.compile_jobs }}" V=s 2>&1 | tee build.log
      - name: Verify compiled DAED provenance
        id: daedbuild
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/verify_daed_provenance.py \
            --packageinfo openwrt/tmp/.packageinfo \
            --lock SOURCES.lock.json \
            --makefile openwrt/package/custom/daed/Makefile \
            --build-log build.log \
            | tee daed-provenance/postbuild.txt
      - name: Inspect firmware
        id: inspect
        continue-on-error: true
        run: python3 scripts/inspect_firmware.py --openwrt openwrt --output inspection --kernel-limit 6291456
      - name: Collect artifact
        if: always()
        run: |
          OUTPUT="Athena-AX6600-v19-${{ github.run_number }}"
          mkdir -p "$OUTPUT/diagnostics"
          cat >"$OUTPUT/diagnostics/step-outcomes.txt" <<EOF
          validate=${{ steps.validate.outcome }}
          defconfig=${{ steps.defconfig.outcome }}
          configcheck=${{ steps.configcheck.outcome }}
          compile=${{ steps.compile.outcome }}
          daedbuild=${{ steps.daedbuild.outcome }}
          inspect=${{ steps.inspect.outcome }}
          daedsource=${{ steps.daedsource.outcome }}
          EOF
          if [ -d openwrt/bin/targets/qualcommax/ipq60xx ]; then
            bash scripts/collect_output.sh \
              openwrt "$OUTPUT" inspection/firmware-inspection.json build.log
          else
            mkdir -p "$OUTPUT/diagnostics"
            printf 'Firmware build did not start or did not produce a target directory.\n' \
              > "$OUTPUT/diagnostics/BUILD_NOT_AVAILABLE.txt"
            cp config/athena-v19.config "$OUTPUT/diagnostics/seed.config"
            cp openwrt/.config "$OUTPUT/diagnostics/effective.config" 2>/dev/null || true
            openwrt/scripts/diffconfig.sh > "$OUTPUT/diagnostics/diffconfig" 2>/dev/null || true
            grep -A30 -B5 '^Package: athena-runtime$' openwrt/tmp/.packageinfo \
              > "$OUTPUT/diagnostics/athena-runtime-packageinfo.txt" 2>/dev/null || true
            if [ -d package-registration ]; then
              cp -a package-registration "$OUTPUT/diagnostics/"
            fi
            if [ -d openwrt/logs/package/custom ]; then
              cp -a openwrt/logs/package/custom "$OUTPUT/diagnostics/package-scan-logs"
            fi
          fi
          if [ -d daed-provenance ]; then
            cp -a daed-provenance "$OUTPUT/diagnostics/daed-provenance"
          fi
          if [ -d daed-source-provenance ]; then
            cp -a daed-source-provenance "$OUTPUT/diagnostics/daed-source-provenance"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Athena-AX6600-v19-${{ github.run_number }}-${{ inputs.release_stage }}
          path: Athena-AX6600-v19-${{ github.run_number }}
          include-hidden-files: true
          retention-days: 14
      - name: Enforce build result
        if: always()
        run: |
          echo "validate=${{ steps.validate.outcome }}"
          echo "defconfig=${{ steps.defconfig.outcome }}"
          echo "configcheck=${{ steps.configcheck.outcome }}"
          echo "compile=${{ steps.compile.outcome }}"
          echo "daedbuild=${{ steps.daedbuild.outcome }}"
          echo "inspect=${{ steps.inspect.outcome }}"
          echo "daedsource=${{ steps.daedsource.outcome }}"
          if [ "${{ steps.validate.outcome }}" != success ]; then
            echo "Source validation already reported the primary failure."
            exit 0
          fi
          if [ "${{ steps.defconfig.outcome }}" != success ] || [ "${{ steps.configcheck.outcome }}" != success ]; then
            echo "OpenWrt configuration already reported the primary failure. Download the diagnostic Artifact."
            exit 0
          fi
          test "${{ steps.daedsource.outcome }}" = success
          test "${{ steps.compile.outcome }}" = success
          test "${{ steps.daedbuild.outcome }}" = success
          test "${{ steps.inspect.outcome }}" = success
